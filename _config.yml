title: Devs Write
description: Stories written by developers.
url: https://devswrite.eapp.site
baseurl: ""

markdown: kramdown

collections:
  stories:
    output: true

# Author, story, layout, permalink and theme inheritance are derived from the
# folder layout by _plugins/stories.rb. Authors only write front matter + prose.
exclude:
  - README.md
  - LICENSE
  - docs
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
