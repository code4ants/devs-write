entries:
  - name: The Ember
    description: The last living coal of the old forge of Karn Dellow. Said to have been lit from the first fire ever struck, it must never be allowed to go out.
  - name: Karn Dellow
    description: A forge-town at the edge of the old road, famed for its smiths. Its great forge went cold on the night the story begins.
  - name: Ashen Marches
    description: A grey, windswept borderland where the road gives out and the grass turns to ash. Few who cross it come back unchanged.
  - name: Hedge-witch
    description: A solitary village healer who works with herbs, charms and the small magics of the wayside rather than the great arts of the cities.
