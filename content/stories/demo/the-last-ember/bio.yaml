characters:
  - name: Mira
    role: Hedge-witch, protagonist
    aspect: Lean and sun-browned, with ash-grey streaks in her braid and a patched green cloak. She keeps one hand over her ribs, where the ember rests.
  - name: Master Orin
    role: Master smith of Karn Dellow
    aspect: A broad, soot-stained man with a white beard singed short and forearms scarred by sixty years at the anvil.
  - name: Edda
    role: Forge apprentice
    aspect: A sharp-eyed girl of fifteen with a leather apron two sizes too large and a habit of counting everything aloud.
