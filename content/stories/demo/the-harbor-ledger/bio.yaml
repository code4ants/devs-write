characters:
  - name: Nell Hargrove
    role: Harbor reporter
    aspect: Mid-thirties, ink on her cuffs and a rain-spotted notebook always open. She wears a battered press cap pulled low.
  - name: Tobias Quill
    role: Dockhand, witness
    aspect: A stooped man with enormous hands and a lantern he swears he did not light. He tells the story differently every time.
