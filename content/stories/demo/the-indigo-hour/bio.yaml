characters:
  - name: Ilinca
    role: Night archivist, protagonist
    aspect: Slight and quiet, with ink-stained fingers, round glasses and a violet scarf she never takes off in the cold reading room.
  - name: Professor Varga
    role: Director of the observatory
    aspect: Tall and stooped, silver-bearded, always half a sentence ahead of everyone else.
  - name: Tomi
    role: Telescope technician
    aspect: Young, restless, in a paint-flecked jacket, with a radio clipped to every pocket.
