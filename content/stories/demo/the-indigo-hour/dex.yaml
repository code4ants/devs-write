entries:
  - name: The Indigo Hour
    description: The minutes just before dawn when the sky over the hill turns the deep blue of the observatory's old star charts.
  - name: Catalogue Room
    description: The vaulted archive under the dome, where every plate and letter the observatory ever received is filed by date.
  - name: Plate 1907-B
    description: A glass photographic plate of the northern sky. It shows a star that no other plate records.
  - name: Relay Console
    description: The archive's terminal, wired to the dome's instruments. Slow, patient and, according to Tomi, haunted.
