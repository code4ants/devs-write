characters:
  - name: Oda
    role: Signals officer
    aspect: Tall and tired, with close-cropped silver hair and a faded orange flight suit. She wears her headset even when she sleeps.
  - name: Relay-9
    role: Station intelligence
    aspect: No body, only a pale cyan glow on the console and a calm voice that is never quite where the clocks say it should be.
