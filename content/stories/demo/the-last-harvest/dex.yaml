entries:
  - name: Hollow Valley
    description: A narrow, fog-prone valley where the orchard has stood for three generations. A single dirt road connects it to the rest of the world.
  - name: The First Frost
    description: The night the temperature drops below freezing. Any fruit still on the branch by then is lost, so every harvest is a race against it.
  - name: Cider Press
    description: A great oak-and-iron press in the old barn, older than the orchard itself. It is said to make the sweetest cider in the county.
  - name: Windfall
    description: Apples that have already fallen from the tree. They bruise easily and are good for little but the press.
  - name: The Heartwood Tree
    description: The oldest apple tree in the orchard, planted by Grandpa Vasile as a boy. Its fruit is small, gold and impossibly sweet.
