characters:
  - name: Ilinca
    role: Orchard keeper, protagonist
    aspect: Weathered and broad-shouldered, with apple-red cheeks, ink-stained fingers and a canvas coat that smells of woodsmoke and cider.
  - name: Grandpa Vasile
    role: Founder of the orchard
    aspect: A stooped old man with a silver moustache and a walking stick cut from a pear branch. He knows the name of every tree.
  - name: Corvin
    role: Cider merchant
    aspect: Sleek and sharp-suited, with a ledger tucked under one arm and boots far too clean for the orchard mud.
