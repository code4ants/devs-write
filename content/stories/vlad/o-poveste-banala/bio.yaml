characters:
  - name: Jakub Kowalczyk
    role: Evaluator de metadate / membru club autori amatori
    aspect: 43 ani, fara trasaturi fizice distincte. Prefera culorile pastelate mute. Personaj real.
  - name: Hiroshi Sato
    role: Fermier
    aspect: 19 ani, 1.60m, constructie atletica. Dexteritate exceptionala, atentie obsesiva pentru detalii. Personaj fictiv.
  - name: Sachiko Sato
    role: Casnica
    aspect: 55 ani, singura ruda in viata a lui Hiroshi. Incearca sa preia ferma familiei Sato. Personaj fictiv.
  - name: Kazuo "Nebunu" Mori
    role: Pensionar
    aspect: 105 ani, cel mai batran locuitor din Ainura. Bolnav de dementa si Alzheimer. Refuza sa vorbeasca cu altcineva decat Hiroshi.
