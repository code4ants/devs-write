characters:
  - name: Mara
    role: Water-runner
    aspect: Wiry and weathered, wrapped in a rust-red scarf against the dust. A cracked radio hangs on her chest, strapped over a patched survival vest.
  - name: The Voice
    role: Unknown broadcaster
    aspect: Never seen. A low, patient voice on a channel that went silent forty years ago, reading out names no one remembers.
