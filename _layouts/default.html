<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body class="{% if page.theme %}theme-{{ page.theme }}{% endif %}">
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>{{ site.title }}</p>
  </footer>
</body>
</html>
