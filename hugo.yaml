baseURL: https://devswrite.eapp.site/
title: Devs Write
locale: en
disableHugoGeneratorInject: true
disableKinds: [taxonomy, term, RSS, sitemap, robotsTXT]

params:
  description: Stories written by developers.

# Author, story, layout and theme inheritance are derived from the folder layout
# (see layouts/). Authors only write front matter + prose.
markup:
  goldmark:
    parser:
      attribute:
        block: true   # enables `{.callout .red}` under a paragraph or blockquote
    renderer:
      unsafe: true
